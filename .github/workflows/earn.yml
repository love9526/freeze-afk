name: AFK Earn

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '运行时长（分钟）'
        required: false
        default: '300'
  schedule:
    - cron: '0 */8 * * *'

jobs:
  earn:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install WARP
        uses: fscarmen/warp-on-actions@main

      - name: Install dependencies
        run: |
          pip install seleniumbase pyvirtualdisplay
          seleniumbase install chromedriver

      - name: Run AFK Earn
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          WARP_PROXY: "socks5://127.0.0.1:40000"
          # auto = WARP 连续失败 2 次自动切直连（避免 WARP IP 被标记导致 Turnstile 一直失败）
          # warp = 只用 WARP   direct = 只用直连
          PROXY_MODE: "auto"
          MAX_RUNTIME: ${{ github.event.inputs.duration || '300' }}
        run: python freeze_afk.py
