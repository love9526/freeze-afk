name: AFK Earn

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # push 触发：调试模式下推代码自动跑（无需 API token）
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      duration:
        description: '运行时长（分钟）'
        required: false
        default: '300'
      proxy_mode:
        description: '代理模式: auto=自动切换 / warp=只用WARP / direct=只用直连'
        required: false
        default: 'auto'
      try_solve:
        description: '尝试自动解图片挑战 (1/0)'
        required: false
        default: '0'
      uc_cdp:
        description: '使用 CDP 模式点击验证码 (1/0)，Xvfb 下更稳但登录流程有变化'
        required: false
        default: '0'
  schedule:
    - cron: '0 */8 * * *'

jobs:
  earn:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install WARP
        uses: fscarmen/warp-on-actions@main

      - name: Install dependencies
        run: |
          pip install seleniumbase pyvirtualdisplay
          seleniumbase install chromedriver

      - name: Run AFK Earn
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          WARP_PROXY: "socks5://127.0.0.1:40000"
          PROXY_MODE: ${{ github.event.inputs.proxy_mode || 'auto' }}
          TRY_SOLVE: ${{ github.event.inputs.try_solve || '0' }}
          UC_CDP: ${{ github.event.inputs.uc_cdp || '0' }}
          MAX_RUNTIME: ${{ github.event.inputs.duration || '300' }}
          LOG_FILE: "/tmp/afk.log"
        run: python freeze_afk.py

      # 把完整日志 + 失败截图推送到 debug-logs 分支（无需额外 token，
      # 用 runner 自带 GITHUB_TOKEN；之后经 api.github.com 匿名读取）
      - name: Publish debug artifacts to debug-logs branch
        if: always()
        run: |
          mkdir -p /tmp/afk-debug
          cp /tmp/afk.log /tmp/afk-debug/afk.log 2>/dev/null || true
          cp /tmp/fh_fail_*.png /tmp/afk-debug/ 2>/dev/null || true
          git config user.name "afk-debug"
          git config user.email "afk-debug@local"
          if git ls-remote --exit-code origin debug-logs >/dev/null 2>&1; then
            git fetch origin debug-logs
            git checkout -B debug-logs origin/debug-logs
          else
            git checkout -b debug-logs
          fi
          mkdir -p "logs/${{ github.run_id }}"
          cp -r /tmp/afk-debug/. "logs/${{ github.run_id }}/" 2>/dev/null || true
          git add "logs/${{ github.run_id }}" || true
          git commit -m "debug artifacts run ${{ github.run_id }}" || true
          git push origin debug-logs || true